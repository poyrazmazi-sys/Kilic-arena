<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Janissary: 1453</title>
<style>
html,body{margin:0;height:100%;background:#0b0806;overflow:hidden;font-family:Georgia,'Times New Roman',serif;color:#e9d9b0}
canvas{display:block;width:100%;height:100%}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(20,12,6,.55),rgba(8,5,3,.92));text-align:center;z-index:5;cursor:pointer}
#overlay h1{font-weight:400;letter-spacing:.35em;font-size:clamp(28px,5vw,64px);margin:0;color:#e2c275;text-shadow:0 2px 24px rgba(0,0,0,.8)}
#overlay .rule{width:min(420px,60vw);height:1px;background:linear-gradient(90deg,transparent,#c9a24b,transparent);margin:18px 0}
#overlay p{margin:6px;opacity:.85;letter-spacing:.08em;font-size:15px}
#hint{position:fixed;left:16px;bottom:14px;font-size:12px;opacity:.6;letter-spacing:.06em;z-index:4;text-shadow:0 1px 3px #000}
#stats{position:fixed;right:16px;top:12px;font:12px monospace;opacity:.6;z-index:4}
</style>
</head>
<body>
<div id="overlay"><h1>JANISSARY: 1453</h1><div class="rule"></div><p id="status">Loading...</p><p>Look test build</p></div>
<div id="hint"></div><div id="stats"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
