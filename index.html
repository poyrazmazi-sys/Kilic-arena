<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Janissary: 1453</title>
<style>
html,body{margin:0;height:100%;background:#0b0806;overflow:hidden;font-family:Georgia,'Times New Roman',serif;color:#e9d9b0}
canvas{display:block;width:100%;height:100%}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(20,12,6,.55),rgba(8,5,3,.92));text-align:center;z-index:5;cursor:pointer}
#overlay h1{font-weight:400;letter-spacing:.35em;font-size:clamp(28px,5vw,64px);margin:0;color:#e2c275;text-shadow:0 2px 24px rgba(0,0,0,.8)}
#overlay .rule{width:min(420px,60vw);height:1px;background:linear-gradient(90deg,transparent,#c9a24b,transparent);margin:18px 0}
#overlay p{margin:6px;opacity:.85;letter-spacing:.08em;font-size:15px}
#hint{position:fixed;left:16px;bottom:14px;font-size:12px;opacity:.6;letter-spacing:.06em;z-index:4;text-shadow:0 1px 3px #000}
#stats{position:fixed;right:16px;top:12px;font:12px monospace;opacity:.6;z-index:4}

.rule{width:min(420px,60vw);height:1px;background:linear-gradient(90deg,transparent,#c9a24b,transparent);margin:14px auto}
#overlay p{max-width:620px;line-height:1.5}
#overlay .small,#win .small{font-size:12px;opacity:.6}
.row{display:flex;gap:10px;margin:10px;justify-content:center}
button{font-family:inherit;font-size:15px;letter-spacing:.12em;color:#e9d9b0;background:rgba(30,20,10,.6);border:1px solid #8a6a2a;padding:9px 20px;cursor:pointer}
button.on{background:#8a6a2a;color:#1a1208}button#go{font-size:20px;padding:12px 46px;border-color:#e2c275;margin-top:8px}
#hud{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity .6s}
#hp{position:absolute;left:28px;bottom:28px;width:220px;height:9px;border:1px solid #c9a24b;background:rgba(10,6,3,.5);transform:skewX(-18deg)}
#hp div{height:100%;background:linear-gradient(90deg,#7a1c14,#c0392b);transition:width .2s}
#ammo{position:absolute;right:30px;bottom:22px;font-size:34px;color:#e2c275;text-shadow:0 2px 8px #000}#ammo span{font-size:16px;opacity:.75}#ammo b{font-weight:400}
#reload{position:absolute;left:50%;bottom:17%;width:200px;height:4px;margin-left:-100px;background:rgba(10,6,3,.5);border:1px solid #c9a24b;transition:opacity .2s}
#reload div{height:100%;background:#e2c275}#reload:after{content:attr(data-label);position:absolute;left:0;right:0;top:-22px;text-align:center;font-size:12px;letter-spacing:.2em;text-transform:uppercase;text-shadow:0 1px 4px #000}
#compass{position:absolute;top:18px;left:50%;width:180px;margin-left:-90px;height:26px;overflow:hidden;border-bottom:1px solid #c9a24b;-webkit-mask-image:linear-gradient(90deg,transparent,#000 25%,#000 75%,transparent);mask-image:linear-gradient(90deg,transparent,#000 25%,#000 75%,transparent)}
#compass div{position:absolute;top:0;left:0;height:26px;white-space:nowrap}#compass span{position:absolute;top:3px;width:40px;margin-left:-20px;text-align:center;font-size:14px;color:#e2c275;text-shadow:0 1px 3px #000}
#compass:after{content:"";position:absolute;left:50%;bottom:0;width:1px;height:8px;background:#e2c275}
#cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#f0e0b0;box-shadow:0 0 3px #000}
#hitmark{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px;opacity:0;background:linear-gradient(45deg,transparent 46%,#f0e0b0 46%,#f0e0b0 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,#f0e0b0 46%,#f0e0b0 54%,transparent 54%)}
#hurt{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(120,10,5,.75))}
#banner{position:absolute;top:22%;left:0;right:0;text-align:center;opacity:0;transition:opacity 1s;text-shadow:0 2px 14px #000}
#banner .b1{font-size:clamp(22px,3.4vw,44px);letter-spacing:.3em;color:#e2c275;text-transform:uppercase}#banner .b2{letter-spacing:.2em;font-size:15px}
#sub{position:absolute;bottom:23%;left:0;right:0;text-align:center;font-size:17px;opacity:0;transition:opacity .5s;text-shadow:0 1px 6px #000,0 0 2px #000;font-style:italic}
#death,#win{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity 1.2s;pointer-events:none;text-align:center}
#death{background:rgba(40,4,2,.6);font-size:20px;letter-spacing:.1em}#win{background:rgba(10,6,3,.72);cursor:pointer}
#win h1{font-weight:400;letter-spacing:.3em;color:#e2c275;font-size:clamp(26px,4.5vw,56px);margin:0;text-transform:uppercase}
#touch{display:none;position:fixed;inset:0;z-index:3;pointer-events:none}
#touch div{position:absolute;pointer-events:auto;width:74px;height:74px;border-radius:50%;border:1px solid #c9a24b;background:rgba(20,12,6,.35);color:#e2c275;display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:.1em;-webkit-user-select:none;user-select:none}
#tFire{right:36px;bottom:110px;width:104px!important;height:104px!important}#tView{right:40px;top:70px;width:60px!important;height:60px!important}
#knob{display:none;position:fixed;width:110px;height:110px;border-radius:50%;border:1px solid rgba(226,194,117,.6);z-index:3;pointer-events:none}#knob div{position:absolute;left:33px;top:33px;width:44px;height:44px;border-radius:50%;background:rgba(226,194,117,.45)}
html,body,canvas{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}#tAim{right:150px;bottom:70px}#tReload{right:40px;bottom:230px}#tSwap{right:140px;bottom:190px}#tJump{right:240px;bottom:40px}
#obj{position:absolute;left:28px;top:20px;text-shadow:0 1px 5px #000;letter-spacing:.12em}
#objText{font-size:17px;color:#e2c275;text-transform:uppercase}#objElims{font-size:13px;margin-top:4px;opacity:.9}
#objBar{position:absolute;left:50%;top:34%;width:240px;height:6px;margin-left:-120px;background:rgba(10,6,3,.5);border:1px solid #c9a24b;opacity:0;transition:opacity .2s}
#objBar div{height:100%;background:#e2c275}#objBar:after{content:attr(data-label);position:absolute;left:-60px;right:-60px;top:-24px;text-align:center;font-size:13px;letter-spacing:.2em;text-transform:uppercase;text-shadow:0 1px 4px #000}
#feed{position:absolute;right:30px;top:52px;font-size:15px;color:#e2c275;opacity:0;text-shadow:0 1px 4px #000;letter-spacing:.1em}
</style>
</head>
<body>
<div id="overlay"><h1>JANISSARY: 1453</h1><div class="rule"></div><p id="status">Loading...</p>
<div id="menu" style="display:none"><p id="intro"></p><p class="small" id="note"></p>
<div class="row" id="diffs"><button data-d="0"></button><button data-d="1"></button><button data-d="2"></button></div>
<div class="row"><button id="lang">English / Türkçe</button></div><button id="go"></button><p class="small" id="controls"></p></div></div>
<div id="hud"><div id="hurt"></div><div id="compass"><div></div></div><div id="cross"></div><div id="hitmark"></div><div id="banner"></div><div id="sub"></div>
<div id="obj"><div id="objText"></div><div id="objElims"></div></div><div id="objBar"><div></div></div><div id="feed"></div>
<div id="reload"><div></div></div><div id="hp"><div></div></div><div id="ammo"></div></div>
<div id="touch"><div id="tFire">FIRE</div><div id="tAim">AIM</div><div id="tReload">LOAD</div><div id="tSwap">SWAP</div><div id="tJump">JUMP</div><div id="tView">VIEW</div></div><div id="knob"><div></div></div>
<div id="death"><div id="deathText"></div></div><div id="win"><div id="winText"></div></div>
<div id="hint"></div><div id="stats"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
